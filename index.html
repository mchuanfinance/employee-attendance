<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>員工出勤打卡系統</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      background: #fff;

      border-radius: 16px;

      padding: 24px;

      margin-bottom: 16px;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 24px;
      text-align: center;

      margin:
        0 0 24px;
    }

    .employee {
      text-align: center;

      font-size: 20px;
      font-weight: bold;

      margin-bottom: 8px;
    }

    .login-status {
      text-align: center;

      font-size: 14px;

      color: #666;

      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    .attendance-status {
      display: flex;

      justify-content: space-between;

      padding: 12px 0;

      border-bottom:
        1px solid #eee;

      font-size: 15px;
    }

    .attendance-status:last-child {
      border-bottom: none;
    }

    .done {
      color: #198754;

      font-weight: bold;
    }

    .not-done {
      color: #888;
    }

    button {
      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 16px;

      margin-top: 12px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      background: #222;

      color: #fff;
    }

    button:disabled {
      background: #ccc;

      color: #777;

      cursor: not-allowed;
    }

    .message {
      padding: 14px;

      border-radius: 10px;

      margin-top: 16px;

      line-height: 1.6;

      display: none;
    }

    .message.success {
      background: #e9f7ef;

      color: #146c43;
    }

    .message.error {
      background: #fce8e6;

      color: #b42318;
    }

    .message.warning {
      background: #fff4ce;

      color: #8a6500;
    }

    .gps {
      font-size: 13px;

      color: #666;

      line-height: 1.6;

      margin-top: 16px;
    }

    .loading {
      text-align: center;

      padding: 20px;

      color: #666;
    }

  </style>

</head>

<body>

  <div class="container">

```
<!-- 員工資訊 -->

<div class="card">

  <h1>
    員工出勤打卡
  </h1>

  <div
    id="employeeName"
    class="employee"
  >
    驗證中...
  </div>

  <div
    id="loginStatus"
    class="login-status"
  >
    LINE 身分驗證中...
  </div>

</div>


<!-- 尚未綁定 -->

<div
  id="bindingCard"
  class="card"
  style="display:none;"
>

  <div
    class="message warning"
    style="display:block;"
  >

    <strong>
      此 LINE 帳號尚未綁定員工
    </strong>

    <br><br>

    請聯絡管理員完成綁定。

    <br><br>

    完成綁定後，請重新開啟此打卡系統。

  </div>

</div>


<!-- 正常打卡 -->

<div
  id="attendanceCard"
  class="card"
  style="display:none;"
>

  <div class="section-title">
    今日出勤
  </div>


  <!-- 上班 -->

  <div class="attendance-status">

    <span>
      上班
    </span>

    <span
      id="workStatus"
      class="not-done"
    >
      尚未打卡
    </span>

  </div>


  <!-- 下班 -->

  <div class="attendance-status">

    <span>
      下班
    </span>

    <span
      id="offStatus"
      class="not-done"
    >
      尚未打卡
    </span>

  </div>


  <!-- 上班按鈕 -->

  <button
    id="workButton"
    onclick="recordAttendance('上班')"
  >
    上班打卡
  </button>


  <!-- 下班按鈕 -->

  <button
    id="offButton"
    onclick="recordAttendance('下班')"
  >
    下班打卡
  </button>


  <!-- GPS -->

  <div
    id="gpsInfo"
    class="gps"
  >
    打卡時將自動取得 GPS 位置及地址。
  </div>


  <!-- 訊息 -->

  <div
    id="message"
    class="message"
  ></div>

</div>


<!-- 載入中 -->

<div
  id="loading"
  class="loading"
>
  系統載入中...
</div>
```

  </div>

<script>


/*************************************************
 * 系統設定
 *************************************************/

const LIFF_ID =
  '2011816957-jjlZqcSN';

const API_URL =
  'https://script.google.com/macros/s/AKfycbwxVKjpnDVqmAwa5jg76_pHgFBBBk5T3HSXxjKXnMzAxSHinM-cR3EVu7iNGEv0vTodLw/exec';


let idToken = '';

let currentEmployeeName = '';


/*************************************************
 * 初始化 LIFF
 *************************************************/

async function init() {

  try {

    // 初始化 LIFF
    await liff.init({
      liffId: LIFF_ID
    });


    // 尚未登入
    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    // 取得 LINE ID Token
    idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        '無法取得 LINE 身分驗證資料'
      );

    }


    // 取得 LINE 顯示名稱
    const profile =
      await liff.getProfile();


    /*
     * 注意：
     *
     * 這裡只把 displayName 顯示給員工。
     *
     * User ID 不顯示。
     *
     * User ID 由後端從 ID Token 驗證取得。
     */


    document.getElementById(
      'employeeName'
    ).textContent =
      profile.displayName || '員工';


    document.getElementById(
      'loginStatus'
    ).textContent =
      'LINE 身分驗證成功';


    // 查詢今日出勤狀態
    await loadTodayAttendance();


  } catch (error) {

    console.error(error);

    document.getElementById(
      'loading'
    ).style.display =
      'none';

    showError(
      '系統初始化失敗：' +
      error.message
    );

  }

}


/*************************************************
 * 查詢今日出勤
 *************************************************/

async function loadTodayAttendance() {

  try {

    const response =
      await fetch(
        API_URL,
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body: JSON.stringify({

            action:
              'getTodayAttendance',

            idToken:
              idToken

          })

        }
      );


    const result =
      await response.json();


    // 隱藏載入中
    document.getElementById(
      'loading'
    ).style.display =
      'none';


    /**********************************************
     * 尚未綁定
     **********************************************/

    if (
      result.bindingPending === true
    ) {

      document.getElementById(
        'attendanceCard'
      ).style.display =
        'none';


      document.getElementById(
        'bindingCard'
      ).style.display =
        'block';


      document.getElementById(
        'loginStatus'
      ).textContent =
        'LINE 身分驗證成功，但尚未完成員工綁定';


      return;

    }


    /**********************************************
     * API 錯誤
     **********************************************/

    if (!result.success) {

      throw new Error(
        result.message ||
        '無法取得今日出勤狀態'
      );

    }


    /**********************************************
     * 正常員工
     **********************************************/

    currentEmployeeName =
      result.employeeName;


    document.getElementById(
      'employeeName'
    ).textContent =
      result.employeeName;


    document.getElementById(
      'attendanceCard'
    ).style.display =
      'block';


    document.getElementById(
      'bindingCard'
    ).style.display =
      'none';


    // 更新畫面
    updateAttendanceUI(result);


  } catch (error) {

    console.error(error);

    document.getElementById(
      'loading'
    ).style.display =
      'none';

    showError(
      error.message
    );

  }

}


/*************************************************
 * 更新今日出勤畫面
 *************************************************/

function updateAttendanceUI(data) {

  const workStatus =
    document.getElementById(
      'workStatus'
    );

  const offStatus =
    document.getElementById(
      'offStatus'
    );

  const workButton =
    document.getElementById(
      'workButton'
    );

  const offButton =
    document.getElementById(
      'offButton'
    );


  /**********************************************
   * 上班
   **********************************************/

  if (data.work.done) {

    workStatus.textContent =
      '已完成 ' +
      data.work.time;


    if (data.work.status) {

      workStatus.textContent +=
        '（' +
        data.work.status +
        '）';

    }


    workStatus.className =
      'done';


    workButton.disabled =
      true;


    workButton.textContent =
      '上班已完成';

  } else {

    workStatus.textContent =
      '尚未打卡';

    workStatus.className =
      'not-done';

    workButton.disabled =
      false;

    workButton.textContent =
      '上班打卡';

  }


  /**********************************************
   * 下班
   **********************************************/

  if (data.off.done) {

    offStatus.textContent =
      '已完成 ' +
      data.off.time;


    if (data.off.status) {

      offStatus.textContent +=
        '（' +
        data.off.status +
        '）';

    }


    offStatus.className =
      'done';


    offButton.disabled =
      true;


    offButton.textContent =
      '下班已完成';

  } else {

    offStatus.textContent =
      '尚未打卡';

    offStatus.className =
      'not-done';

    offButton.disabled =
      false;

    offButton.textContent =
      '下班打卡';

  }

}


/*************************************************
 * 取得 GPS
 *************************************************/

function getGPS() {

  return new Promise(
    (resolve, reject) => {

      if (!navigator.geolocation) {

        reject(
          new Error(
            '此裝置不支援 GPS 定位'
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy

          });

        },

        error => {

          let message =
            '無法取得 GPS 位置';


          switch (error.code) {

            case 1:

              message =
                '您拒絕了 GPS 定位權限，請允許此網頁使用位置資訊。';

              break;


            case 2:

              message =
                '目前無法取得 GPS 位置，請確認手機定位功能已開啟。';

              break;


            case 3:

              message =
                'GPS 定位逾時，請稍後再試。';

              break;

          }


          reject(
            new Error(message)
          );

        },

        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }
  );

}


/*************************************************
 * 上班 / 下班打卡
 *************************************************/

async function recordAttendance(type) {

  const workButton =
    document.getElementById(
      'workButton'
    );

  const offButton =
    document.getElementById(
      'offButton'
    );


  // 暫時鎖定按鈕
  if (type === '上班') {

    workButton.disabled =
      true;

  } else {

    offButton.disabled =
      true;

  }


  hideMessage();


  try {

    /**********************************************
     * 取得 GPS
     **********************************************/

    showMessage(
      '正在取得 GPS 位置...',
      'warning'
    );


    const gps =
      await getGPS();


    /**********************************************
     * 顯示 GPS 資訊
     **********************************************/

    document.getElementById(
      'gpsInfo'
    ).textContent =
      'GPS：' +
      gps.latitude.toFixed(6) +
      ', ' +
      gps.longitude.toFixed(6) +
      '｜誤差約 ' +
      Math.round(gps.accuracy) +
      ' 公尺';


    /**********************************************
     * 傳送打卡
     **********************************************/

    showMessage(
      '正在送出打卡資料...',
      'warning'
    );


    const response =
      await fetch(
        API_URL,
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body: JSON.stringify({

            action:
              'recordAttendance',

            idToken:
              idToken,

            type:
              type,

            latitude:
              gps.latitude,

            longitude:
              gps.longitude,

            accuracy:
              gps.accuracy

          })

        }
      );


    const result =
      await response.json();


    /**********************************************
     * 尚未綁定
     **********************************************/

    if (
      result.bindingPending === true
    ) {

      document.getElementById(
        'attendanceCard'
      ).style.display =
        'none';


      document.getElementById(
        'bindingCard'
      ).style.display =
        'block';


      throw new Error(
        '此 LINE 帳號尚未綁定員工，請聯絡管理員完成綁定。'
      );

    }


    /**********************************************
     * 打卡失敗
     **********************************************/

    if (!result.success) {

      throw new Error(
        result.message ||
        '打卡失敗'
      );

    }


    /**********************************************
     * 打卡成功
     **********************************************/

    let successText =
      type +
      '打卡成功';


    if (result.time) {

      successText +=
        '｜時間：' +
        result.time;

    }


    if (result.status) {

      successText +=
        '｜狀態：' +
        result.status;

    }


    showMessage(
      successText,
      'success'
    );


    /**********************************************
     * 重新載入今日狀態
     **********************************************/

    await loadTodayAttendance();


  } catch (error) {

    console.error(error);


    showMessage(
      error.message,
      'error'
    );


    /*
     * 如果不是已完成打卡，
     * 恢復按鈕。
     */

    if (type === '上班') {

      workButton.disabled =
        false;

    } else {

      offButton.disabled =
        false;

    }

  }

}


/*************************************************
 * 顯示訊息
 *************************************************/

function showMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      'message'
    );


  box.textContent =
    message;


  box.className =
    'message ' +
    type;


  box.style.display =
    'block';

}


/*************************************************
 * 隱藏訊息
 *************************************************/

function hideMessage() {

  const box =
    document.getElementById(
      'message'
    );


  box.style.display =
    'none';

}


/*************************************************
 * 顯示錯誤
 *************************************************/

function showError(message) {

  document.getElementById(
    'attendanceCard'
  ).style.display =
    'block';


  showMessage(
    message,
    'error'
  );

}


/*************************************************
 * 啟動
 *************************************************/

window.addEventListener(
  'load',
  init
);


</script>

</body>

</html>
